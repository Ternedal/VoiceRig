[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicerig"
version = "0.1.0"
description = "Local-first voice profile builder for ModelRig"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ternedal" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Chatterbox 0.1.7 pins torch/torchaudio 2.6.0. On Windows setup-windows.ps1
# installs the official CUDA 12.6 wheels first so pip cannot silently choose a
# CPU-only build.
voice = [
  "chatterbox-tts==0.1.7",
]
# Current pyannote requires torch >=2.8, which is incompatible with Chatterbox's
# 2.6 pin. It therefore runs in a separate CPU-only venv/process.
diarization = [
  "pyannote.audio>=4.0.7,<5",
]
test = ["pytest>=8.0"]

[project.scripts]
voicerig = "voicerig.app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["voicerig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
