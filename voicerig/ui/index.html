<!doctype html>
<html lang="da"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>VoiceRig</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#111;color:#f5f5f5;min-height:100vh;display:grid;place-items:center}main{width:min(720px,92vw)}h1{font-size:2.2rem;margin-bottom:.2rem}.muted{color:#aaa}#drop{border:2px dashed #555;border-radius:18px;padding:52px 24px;text-align:center;cursor:pointer;margin:24px 0}#drop.drag{border-color:#eee;background:#191919}input[type=file]{display:none}input[type=text]{width:100%;box-sizing:border-box;padding:14px;font-size:1rem;border-radius:10px;border:1px solid #444;background:#181818;color:white}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}#files{margin:.8rem 0;color:#bbb}#status{margin-top:18px;min-height:28px}#hardware.ready{color:#b9e6c5}#hardware.warn{color:#f0d99b}a{color:white}</style></head><body><main><h1>VoiceRig</h1><div class="muted">Smid et par lyd- eller videoklip ind. Resten klarer VoiceRig.</div><div id="hardware" class="muted" style="margin-top:.5rem">Tjekker hardware…</div><div id="drop">Træk filer hertil<br><span class="muted">eller klik for at vælge</span></div><input id="picker" type="file" multiple accept="audio/*,video/*"/><div id="files"></div><input id="name" type="text" placeholder="Navn på stemmen" autocomplete="off"/><button id="create" disabled>Opret stemme</button><div id="status"></div></main><script>const picker=document.querySelector('#picker'),drop=document.querySelector('#drop'),filesEl=document.querySelector('#files');const nameEl=document.querySelector('#name'),button=document.querySelector('#create'),statusEl=document.querySelector('#status'),hardwareEl=document.querySelector('#hardware');let files=[],runtimeReady=false;function render(){filesEl.textContent=files.length?`${files.length} fil${files.length===1?'':'er'} valgt`:'';button.disabled=!runtimeReady||!files.length||!nameEl.value.trim()}function renderSuccess(data){statusEl.textContent=`✓ ${data.voice.name} er klar.${data.installed_in_modelrig?' Installeret i ModelRig.':''} `;const link=document.createElement('a');link.href=data.download_url;link.textContent='Gem .mrvoice';statusEl.appendChild(link)}fetch('/api/readiness').then(r=>r.json()).then(data=>{const h=data.hardware||{};const gpu=h.gpu||'GPU';const vram=h.vram_total_gb?` · ${h.vram_total_gb} GB VRAM`:'';runtimeReady=!!data.ready;if(data.ready){hardwareEl.className='ready';const warning=(data.warnings||[])[0];hardwareEl.textContent=`Klar · ${gpu}${vram} · speaker-analyse på CPU${warning?` · ${warning}`:''}`}else{hardwareEl.className='warn';const reason=(data.blockers||[])[0]||'Opsætningen er ikke helt klar';hardwareEl.textContent=`Opsætning mangler · ${reason}`}render()}).catch(()=>{runtimeReady=false;hardwareEl.className='warn';hardwareEl.textContent='Kunne ikke kontrollere hardware endnu';render()});drop.onclick=()=>picker.click();picker.onchange=()=>{files=[...picker.files];render()};nameEl.oninput=render;['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{files=[...e.dataTransfer.files];render()});button.onclick=async()=>{button.disabled=true;statusEl.textContent='Analyserer og opretter stemmen…';const fd=new FormData();fd.append('name',nameEl.value.trim());fd.append('language','da');fd.append('install_in_modelrig','true');files.forEach(f=>fd.append('files',f));try{const r=await fetch('/api/voices',{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Ukendt fejl');renderSuccess(data)}catch(err){statusEl.textContent='Fejl: '+err.message}finally{render()}};</script></body></html>
