<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>VoiceRig</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}
    body{margin:0;background:#111;color:#f5f5f5;min-height:100vh;display:grid;place-items:center}
    main{width:min(720px,92vw)}
    h1{font-size:2.2rem;margin-bottom:.2rem}
    .muted{color:#aaa}
    #drop{border:2px dashed #555;border-radius:18px;padding:52px 24px;text-align:center;cursor:pointer;margin:24px 0}
    #drop.drag{border-color:#eee;background:#191919}
    input[type=file]{display:none}
    input[type=text]{width:100%;box-sizing:border-box;padding:14px;font-size:1rem;border-radius:10px;border:1px solid #444;background:#181818;color:white}
    button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}
    #files{margin:.8rem 0;color:#bbb}
    #status{margin-top:18px;min-height:28px}
    #hardware.ready{color:#b9e6c5}
    #hardware.warn{color:#f0d99b}
    .speaker-grid{display:grid;gap:12px;margin-top:14px}
    .speaker-card{border:1px solid #3d3d3d;border-radius:12px;padding:14px;background:#181818}
    .speaker-title{font-weight:700;margin-bottom:8px}
    .speaker-card audio{width:100%}
    .speaker-card button{margin-top:10px}
    a{color:white}
  </style>
</head>
<body>
<main>
  <h1>VoiceRig</h1>
  <div class="muted">Smid et par lyd- eller videoklip ind. Resten klarer VoiceRig.</div>
  <div id="hardware" class="muted" style="margin-top:.5rem">Tjekker hardware…</div>
  <div id="drop">Træk filer hertil<br><span class="muted">eller klik for at vælge</span></div>
  <input id="picker" type="file" multiple accept="audio/*,video/*"/>
  <div id="files"></div>
  <input id="name" type="text" placeholder="Navn på stemmen" autocomplete="off" maxlength="160"/>
  <button id="create" disabled>Opret stemme</button>
  <div id="status"></div>
</main>
<script>
const picker=document.querySelector('#picker');
const drop=document.querySelector('#drop');
const filesEl=document.querySelector('#files');
const nameEl=document.querySelector('#name');
const button=document.querySelector('#create');
const statusEl=document.querySelector('#status');
const hardwareEl=document.querySelector('#hardware');
let files=[];
let runtimeReady=false;
let building=false;

function render(){
  filesEl.textContent=files.length?`${files.length} fil${files.length===1?'':'er'} valgt`:'';
  button.disabled=building||!runtimeReady||!files.length||!nameEl.value.trim();
}

function clearStatus(){ statusEl.replaceChildren(); }

function renderSuccess(data){
  clearStatus();
  statusEl.append(document.createTextNode(`✓ ${data.voice.name} er klar.${data.installed_in_modelrig?' Installeret i ModelRig.':''} `));
  const link=document.createElement('a');
  link.href=data.download_url;
  link.textContent='Gem .mrvoice';
  statusEl.appendChild(link);
}

function renderSpeakerChoices(detail){
  clearStatus();
  const message=document.createElement('div');
  message.textContent=detail.message||'Vi fandt flere stemmer. Hvilken vil du bruge?';
  statusEl.appendChild(message);
  const grid=document.createElement('div');
  grid.className='speaker-grid';
  for(const speaker of detail.speakers||[]){
    const card=document.createElement('div');
    card.className='speaker-card';
    const title=document.createElement('div');
    title.className='speaker-title';
    title.textContent=`${speaker.label} · ca. ${speaker.speech_seconds} sek. tale`;
    const audio=document.createElement('audio');
    audio.controls=true;
    audio.preload='metadata';
    audio.src=`data:audio/wav;base64,${speaker.preview_wav_base64}`;
    const use=document.createElement('button');
    use.type='button';
    use.textContent='Brug denne stemme';
    use.onclick=()=>submitBuild(speaker.anchor);
    card.append(title,audio,use);
    grid.appendChild(card);
  }
  statusEl.appendChild(grid);
}

function errorMessage(detail){
  if(typeof detail==='string') return detail;
  if(detail&&typeof detail.message==='string') return detail.message;
  return 'Ukendt fejl';
}

async function submitBuild(speakerAnchor=null){
  building=true;
  render();
  clearStatus();
  statusEl.textContent=speakerAnchor===null?'Analyserer og opretter stemmen…':'Opretter stemmen fra dit valg…';
  const fd=new FormData();
  fd.append('name',nameEl.value.trim());
  fd.append('language','da');
  fd.append('install_in_modelrig','true');
  if(speakerAnchor!==null) fd.append('speaker_anchor',speakerAnchor);
  files.forEach(file=>fd.append('files',file));
  try{
    const response=await fetch('/api/voices',{method:'POST',body:fd});
    const data=await response.json();
    if(!response.ok){
      if(response.status===409&&data.detail&&data.detail.code==='speaker_selection_required'){
        renderSpeakerChoices(data.detail);
        return;
      }
      throw new Error(errorMessage(data.detail));
    }
    renderSuccess(data);
  }catch(error){
    statusEl.textContent='Fejl: '+error.message;
  }finally{
    building=false;
    render();
  }
}

fetch('/api/readiness').then(response=>response.json()).then(data=>{
  const h=data.hardware||{};
  const gpu=h.gpu||'GPU';
  const vram=h.vram_total_gb?` · ${h.vram_total_gb} GB VRAM`:'';
  runtimeReady=!!data.ready;
  if(data.ready){
    hardwareEl.className='ready';
    const warning=(data.warnings||[])[0];
    hardwareEl.textContent=`Klar · ${gpu}${vram} · speaker-analyse på CPU${warning?` · ${warning}`:''}`;
  }else{
    hardwareEl.className='warn';
    const reason=(data.blockers||[])[0]||'Opsætningen er ikke helt klar';
    hardwareEl.textContent=`Opsætning mangler · ${reason}`;
  }
  render();
}).catch(()=>{
  runtimeReady=false;
  hardwareEl.className='warn';
  hardwareEl.textContent='Kunne ikke kontrollere hardware endnu';
  render();
});

drop.onclick=()=>picker.click();
picker.onchange=()=>{files=[...picker.files];clearStatus();render()};
nameEl.oninput=render;
['dragenter','dragover'].forEach(event=>drop.addEventListener(event,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(event=>drop.addEventListener(event,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',event=>{files=[...event.dataTransfer.files];clearStatus();render()});
button.onclick=()=>submitBuild();
</script>
</body>
</html>
