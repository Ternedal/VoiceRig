name: exact-head-qualification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact commit SHA to qualify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: voicerig-exact-head-${{ inputs.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  linux-package-and-tests:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ inputs.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact checkout authority
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || { echo "checkout mismatch: $actual != $EXPECTED_SHA" >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m compileall -q voicerig
      - name: JavaScript syntax
        run: |
          node --check voicerig/ui/app.js
          node --check voicerig/ui/voice-options.js
          node --check voicerig/ui/reference-flow.js
          node --check voicerig/ui/danish-engine-compare.js
      - name: Build package
        run: |
          python -m pip install build
          python -m build
          test -n "$(find dist -maxdepth 1 -name 'voicerig-*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name 'voicerig-*.tar.gz' -print -quit)"

  windows-runtime:
    runs-on: windows-latest
    env:
      EXPECTED_SHA: ${{ inputs.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Assert exact checkout authority
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA.ToLowerInvariant()) {
            throw "checkout mismatch: $actual != $env:EXPECTED_SHA"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Windows PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Path . -File -Filter *.ps1 | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$Tokens,[ref]$Errors)
            if ($Errors.Count -gt 0) { throw "$($_.Name) failed PowerShell parse" }
          }
      - name: Windows package smoke
        shell: pwsh
        run: |
          python -m pip install build
          python -m build --wheel
          $Wheel = (Get-ChildItem -Path dist -Filter "voicerig-*.whl" | Select-Object -First 1).FullName
          if (-not $Wheel) { throw "VoiceRig wheel missing" }
          python -m pip install $Wheel
          python -m pip check
          python -c "import voicerig; print(voicerig.__version__)"
