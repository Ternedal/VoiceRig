name: danish-engine-contract
on:
  push:
  pull_request:

jobs:
  packaged-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: JavaScript syntax
        run: |
          node --check voicerig/ui/app.js
          node --check voicerig/ui/voice-options.js
          node --check voicerig/ui/reference-flow.js
          node --check voicerig/ui/danish-engine-compare.js
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Prove voice engine and locale assets are packaged
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("voicerig-*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
              required = {
                  "voicerig/ui/index.html",
                  "voicerig/ui/app.js",
                  "voicerig/ui/voice-options.js",
                  "voicerig/ui/reference-flow.js",
                  "voicerig/ui/danish-engine-compare.js",
                  "voicerig/languages.py",
                  "voicerig/engines/rost.py",
                  "voicerig/engines/omnivoice.py",
                  "voicerig/engines/omnivoice_worker.py",
              }
              missing = sorted(required - names)
              assert not missing, f"wheel missing voice runtime/UI assets: {missing}"
              html = zf.read("voicerig/ui/index.html").decode("utf-8")
              compare_js = zf.read("voicerig/ui/danish-engine-compare.js").decode("utf-8")
              options_js = zf.read("voicerig/ui/voice-options.js").decode("utf-8")
              languages_py = zf.read("voicerig/languages.py").decode("utf-8")
              assert '/ui/danish-engine-compare.js' in html
              assert '/ui/voice-options.js' in html
              assert 'voiceLocale' in html
              assert 'voiceAccent' in html
              assert 'compareRostVoice' in html
              assert 'compareOmniVoice' in html
              assert '/api/tts/compare/rost' in compare_js
              assert '/api/tts/compare/omnivoice' in compare_js
              assert 'voice_package: voice.package' in compare_js
              assert '/api/voice-options' in options_js
              assert "form.append('language', localeSelect.value" in options_js
              assert "form.append('accent', accentSelect.value)" in options_js
              assert 'general-american' in languages_py
              assert 'southern-us' in languages_py
              assert 'new-york-city' in languages_py
              assert 'engine_language_id' in languages_py
          print("Voice engine + locale/accent packaged contract: PASS")
          PY
