[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicerig"
dynamic = ["version"]
description = "Local-first voice profile builder for ModelRig"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ternedal" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# PyPI 0.1.7 predates the current Multilingual V3 code surface even though
# upstream still reports version 0.1.7. Pin the verified V3 source revision
# instead. It keeps the same torch/torchaudio 2.6.0 requirement on Python 3.11.
voice = [
  "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
]
# pyannote 4.0.7 requires a newer torch generation than Chatterbox. Keep the
# verified version in a separate CPU-only venv/process so future pyannote
# releases cannot silently change VoiceRig's diarization contract.
diarization = [
  "pyannote.audio==4.0.7",
]
test = ["pytest>=8.0"]

[project.scripts]
voicerig = "voicerig.app.main:run"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "voicerig/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["voicerig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
